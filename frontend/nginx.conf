server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Wszystkie ścieżki kieruj do index.html
    # Bez tego React Router nie działa - /hr zwraca 404 z nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy dla API - zapytania /api/* idą do backendu
    # Dzięki temu nie ma problemu z CORS w przeglądarce
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache dla statycznych assetów (JS, CSS, obrazki)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
